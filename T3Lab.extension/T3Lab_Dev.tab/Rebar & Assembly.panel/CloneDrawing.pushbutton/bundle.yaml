title: "Clone\nDrawing"
tooltip: "Copy the finished drawing of one assembly — views, sheet, annotations, tags and dimensions — to similar assemblies (Tekla: clone drawing)"
description: |
  Pick a source assembly whose views and sheet are finished (Tekla: cloning template), then tick similar target assemblies — from the grid, the Revit selection or a pick in the model
  Clone settings per object type like Tekla's Clone drawing dialog: views and sheet, manual sections, dimensions, spot elevations, tags (clone, or clone + create for unmatched members), text, symbols, detail lines, imports, revision clouds, overrides, sheet parameters — saved as presets
  Tags, dimensions and spot elevations are re-created on matched target elements (position, shape, bar type, mirror-aware); everything that cannot be matched is listed as unmatched with the reason
  Existing drawings: skip, add missing, create a new set, or replace annotations after an explicit confirmation
  One undo step for the whole run; views, sheets and model elements are never deleted
author: "Tran Tien Thanh"
version: "2.0.0"
