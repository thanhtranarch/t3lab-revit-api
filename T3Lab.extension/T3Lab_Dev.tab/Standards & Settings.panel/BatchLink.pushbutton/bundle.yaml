title: "Batch\nLink"
tooltip: "Manage Revit links, link new models, set the workset each link sits on, control per-view link display"
description: |
  Manage Links: status, path, reference type and pins of every link; Reload, Reload From, Unload, Pin, Overlay / Attachment, Remove
  Link Models: pick a folder, filter backups, link many models at once, each on its own workset if you want
  Link Workset: move the link instances of this model onto one of its worksets
  View Display: set By Host View / By Linked View / Custom, visibility and halftone
  Display settings need Revit 2025 or newer
author: "Tran Tien Thanh"
version: "1.2.0"
